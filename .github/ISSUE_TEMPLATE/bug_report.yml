name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Don't file it here; see [SECURITY.md](https://github.com/riddlemd/PoniExp/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. poniexp-client ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Router (poniexp / container)
        - Client CLI (poniexp-client)
        - Daemon
        - MCP server
        - Dashboard
        - Integrations (Hermes / Claude Code)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `poniexp-client --version`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: e.g. macOS 15 arm64, Windows 11 x64, Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant daemon or router output (`docker logs poniexp-server`). Remove anything private.
      render: text
