name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PoniExp.slnx

      - name: Build
        run: dotnet build PoniExp.slnx --no-restore -c Release

      - name: Test
        run: dotnet test PoniExp.slnx --no-build -c Release --logger "console;verbosity=normal"
